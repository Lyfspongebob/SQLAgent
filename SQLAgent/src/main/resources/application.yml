spring:
  application:
    name: sqlagent

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true

  datasource:
    url: jdbc:mysql://localhost:3306/sqlagent
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

#  datasource:
#    url: jdbc:mysql://rm-bp142f59xsa65axiw.mysql.rds.aliyuncs.com:3306/sqlagent?useSSL=false&serverTimezone=Asia/Shanghai
#    username: lyf_mysql
#    password: ${DB_PASSWORD:}
#    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

sa-token:
  token-name: satoken
  timeout: 604800
  allow-concurrent-login: false
  is-share: false
  token-style: uuid
  is-log: true

server:
  port: 8084

# DeepSeek API Configuration
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  api-url: https://api.deepseek.com/v1/chat/completions
  model: deepseek-v4-flash

# ZhipuAI Knowledge Base Configuration
zhipu:
  api-key: ${ZHIPU_API_KEY:}
  knowledge-base-id: 1906275880188198912
  api-url: https://open.bigmodel.cn/api/paas/v4/chat/completions
  retrieval-url: https://open.bigmodel.cn/api/llm-application/open/knowledge/retrieve
  model: glm-4.6
  top-k: 5
  top-n: 20
  recall-method: mixed

# SQL Agent Configuration
sql-agent:
  max-retry-times: 3
  vote-count: 10
  temperature: 0.8

sql-agent-v2:
  candidate-count: 5
  temperature: 0.3
  min-consensus: 2
  min-consensus-ratio: 0.6
  generation-stability-high: 0.8
  generation-stability-medium: 0.6

  query-timeout-seconds: 15
  max-rows: 500
  max-cell-chars: 8000
  max-schema-chars: 20000

  repair-times: 2

# Schema 获取策略（对比实验用）：A  local-cache / B  knowledge-base / C  realtime
schema:
  strategy: knowledge-base

logging:
  level:
    com.example.sqlagent.agent.KnowledgeBaseService: DEBUG
