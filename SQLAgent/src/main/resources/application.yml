spring:
  application:
    name: sqlagent

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true

  datasource:
    url: jdbc:mysql://localhost:3306/sqlagent
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

#  datasource:
#    url: jdbc:mysql://rm-bp142f59xsa65axiw.mysql.rds.aliyuncs.com:3306/sqlagent?useSSL=false&serverTimezone=Asia/Shanghai
#    username: lyf_mysql
#    password: ${DB_PASSWORD:}
#    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  servlet:
    multipart:
      max-file-size: 21MB
      max-request-size: 22MB

sa-token:
  token-name: satoken
  timeout: 604800
  allow-concurrent-login: false
  is-share: false
  token-style: uuid
  is-log: true

server:
  port: 8084

attachments:
  storage-dir: ${ATTACHMENT_STORAGE_DIR:./data/attachments}
  max-file-size-bytes: ${ATTACHMENT_MAX_FILE_BYTES:5242880}
  max-document-size-bytes: ${ATTACHMENT_MAX_DOCUMENT_BYTES:20971520}
  max-total-size-bytes: ${ATTACHMENT_MAX_TOTAL_BYTES:31457280}
  max-total-image-bytes: ${ATTACHMENT_MAX_TOTAL_IMAGE_BYTES:12582912}
  max-files-per-message: 4
  max-text-chars: 20000
  max-total-text-chars: 40000
  max-pdf-pages: 300
  max-word-paragraphs: 20000
  max-excel-rows-per-sheet: 5000
  max-excel-columns: 60
  max-document-units: 500
  max-document-unit-chars: 6000
  max-document-context-chars: 16000
  max-context-chars-per-document: 10000
  max-context-units-per-document: 4

agent:
  max-steps: 8
  temperature: 0.2
  document-read-max-chars: 16000
  max-schema-chars: 30000
  query-timeout-seconds: 15
  max-query-rows: 200
  max-result-cell-chars: 4000
  max-tool-result-rows: 50

# DeepSeek API Configuration
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  api-url: https://api.deepseek.com/v1/chat/completions
  model: ${DEEPSEEK_MODEL:deepseek-v4-flash}

# ZhipuAI Knowledge Base Configuration
zhipu:
  api-key: ${ZHIPU_API_KEY:}
  knowledge-base-id: 1906275880188198912
  api-url: https://open.bigmodel.cn/api/paas/v4/chat/completions
  retrieval-url: https://open.bigmodel.cn/api/llm-application/open/knowledge/retrieve
  model: glm-4.6
  top-k: 5
  top-n: 20
  recall-method: mixed

# SQL Agent Configuration
sql-agent:
  max-retry-times: 3
  vote-count: 10
  temperature: 0.8

sql-agent-v2:
  candidate-count: 5
  temperature: 0.3
  min-consensus: 2
  min-consensus-ratio: 0.6
  generation-stability-high: 0.8
  generation-stability-medium: 0.6

  query-timeout-seconds: 15
  max-rows: 500
  max-cell-chars: 8000
  max-schema-chars: 20000

  repair-times: 2

# Schema 获取策略（对比实验用）：A  local-cache / B  knowledge-base / C  realtime
schema:
  strategy: knowledge-base

logging:
  level:
    com.example.sqlagent.agent.KnowledgeBaseService: DEBUG
